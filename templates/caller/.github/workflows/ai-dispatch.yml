name: AI dispatch

# Thin caller. All logic lives in devsoliadata-creator/ai-dispatch, pinned to
# one reviewed commit: every `@<sha>` below and `dispatch_ref` must agree.
# `cto bump` updates them together. Per-repo settings: setup_command,
# verify_command, ci_workflow, deploy_workflow.
#
# The flow this file wires:
#   issue (Proposed) --CTO: GO--> Ready --> Claude worker --> PR (cto:review)
#   --CTO: APPROVE--> cto:approved --> merge --> Done --JM: DEPLOY TO PROD--> deploy
#   worker blocked --> cto:triage --CTO: GO/BLOCK-->  |  CTO: REWORK --> Ready again

on:
  issues:
    types: [opened, edited, reopened, labeled, unlabeled]
  pull_request:
    types: [opened, edited, reopened, ready_for_review, converted_to_draft, closed]
  issue_comment:
    types: [created]
  workflow_dispatch:
    inputs:
      issue:
        description: "Feature control issue number"
        required: true
        type: string
      force:
        description: "Re-dispatch even though an active claim exists"
        type: boolean
        default: false

jobs:
  dispatch:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'issues' && github.event.action != 'labeled' && github.event.action != 'unlabeled') ||
      (github.event_name == 'issues' && (github.event.label.name == 'agent:claude' || startsWith(github.event.label.name, 'skill:')))
    concurrency:
      group: feature-dispatch-${{ github.event.issue.number || inputs.issue }}
      cancel-in-progress: false
    permissions:
      contents: write
      issues: write
      pull-requests: write
      id-token: write
      actions: write
    uses: devsoliadata-creator/ai-dispatch/.github/workflows/dispatch.yml@main
    with:
      issue: "${{ github.event.issue.number || inputs.issue }}"
      force: ${{ inputs.force == true }}
      # REPLACE: how the runner installs this repo's dependencies before the worker starts ("" if none).
      setup_command: ""
      # REPLACE with this repo's one test/lint entry point, or leave "" for none.
      # Approved shapes: python3 <file>.py | python3 -m pytest | npm test | npm run <name> | make <target> | dotnet test | go test | cargo test
      verify_command: ""
    secrets: inherit

  pr-sync:
    if: github.event_name == 'pull_request'
    concurrency:
      group: feature-pr-sync-${{ github.event.pull_request.number }}
      cancel-in-progress: false
    permissions:
      contents: read
      issues: write
      pull-requests: write
      actions: write
    uses: devsoliadata-creator/ai-dispatch/.github/workflows/pr-sync.yml@main
    with:
      pull: "${{ github.event.pull_request.number }}"
      action: ${{ github.event.action }}
    secrets: inherit

  # A `CTO:` comment. On a PR: APPROVE / REWORK / BLOCK (the review). On the
  # control issue: GO / BLOCK (approval of a new feature, triage of a blocked one).
  cto-verdict:
    if: github.event_name == 'issue_comment' && startsWith(github.event.comment.body, 'CTO:')
    permissions:
      contents: read
      issues: write
      pull-requests: write
      actions: write
    uses: devsoliadata-creator/ai-dispatch/.github/workflows/cto-verdict.yml@main
    with:
      pull: "${{ github.event.issue.pull_request && github.event.issue.number || '' }}"
      issue: "${{ !github.event.issue.pull_request && github.event.issue.number || '' }}"
      comment_body: ${{ github.event.comment.body }}
      author_association: ${{ github.event.comment.author_association }}
    secrets: inherit

  # JM ships a Done feature by adding the `DEPLOY TO PROD` label to its issue.
  deploy:
    if: github.event_name == 'issues' && github.event.action == 'labeled' && github.event.label.name == 'DEPLOY TO PROD'
    permissions:
      contents: read
      issues: write
      actions: write
    uses: devsoliadata-creator/ai-dispatch/.github/workflows/deploy.yml@main
    with:
      issue: "${{ github.event.issue.number }}"
      # REPLACE with this repo's deploy workflow file (e.g. deploy-vps.yml); "" = this repo has no deploy.
      deploy_workflow: ""

  labels:
    if: github.event_name == 'workflow_dispatch'
    permissions:
      issues: write
    uses: devsoliadata-creator/ai-dispatch/.github/workflows/labels.yml@main
